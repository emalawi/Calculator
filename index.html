<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Online Calculator - Fast & Easy Calculations</title>
    <meta name="description" content="Use our free online calculator to perform quick and accurate calculations. Simple, fast, and mobile-friendly.">

    <meta name="robots" content="index, follow">

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f4f7fb;
            color:#333;
        }

        header{
            background:#2563eb;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            background:#1d4ed8;
            text-align:center;
            padding:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:bold;
        }

        .container{
            max-width:800px;
            margin:auto;
            padding:20px;
        }

        .calculator{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            font-size:18px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            font-size:18px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        #result{
            margin-top:20px;
            font-size:22px;
            font-weight:bold;
            color:#2563eb;
        }

        footer{
            margin-top:40px;
            background:#222;
            color:white;
            text-align:center;
            padding:20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Free Online Calculator</h1>
    <p>Fast, Simple and Accurate Calculator</p>
</header>

<nav>
    <a href="index.html">Home</a>
</nav>

<div class="container">

<div class="calculator">

<h2>Simple Addition Calculator</h2>

<input type="number" id="num1" placeholder="First Number">

<input type="number" id="num2" placeholder="Second Number">

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

</div>

<h2>About This Calculator</h2>

<p>
This free online calculator helps you quickly add two numbers.
It is simple, mobile-friendly, and works on any modern browser.
</p>

</div>

<footer>
© 2026 Free Online Calculator
</footer>

<script>
function calculate(){

let a=parseFloat(document.getElementById("num1").value)||0;
let b=parseFloat(document.getElementById("num2").value)||0;

document.getElementById("result").innerHTML="Result: "+(a+b);

}
</script>

</body>
  </html>
